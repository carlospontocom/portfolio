name: Deploy to Firebase

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      # 🔧 FORÇA A INSTALAÇÃO DO TAILWIND
      - name: Verify and force install Tailwind
        run: |
          echo "🔍 Verificando instalação do Tailwind..."
          npm list tailwindcss @tailwindcss/vite || echo "⚠️ Tailwind não encontrado, instalando..."
          npm install tailwindcss @tailwindcss/vite --save-dev
          echo "✅ Tailwind instalado:"
          npm list tailwindcss @tailwindcss/vite
      
      # 🔑 Cria o .env com os Secrets
      - name: Create .env file
        run: |
          echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}" >> .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}" >> .env
          echo "VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" >> .env
          echo "VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}" >> .env
          echo "VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}" >> .env
          echo "VITE_EMAILJS_SERVICE_ID=${{ secrets.VITE_EMAILJS_SERVICE_ID }}" >> .env
          echo "VITE_EMAILJS_TEMPLATE_ID=${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}" >> .env
          echo "VITE_EMAILJS_PUBLIC_KEY=${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}" >> .env
      
      # 🔍 DIAGNÓSTICO - Verifica o que foi gerado
      - name: Debug build output
        run: |
          echo "📁 Arquivos gerados no build:"
          ls -la dist/
          echo ""
          echo "📄 Verificando CSS:"
          if ls dist/assets/*.css 2>/dev/null; then
            echo "✅ CSS encontrado!"
            ls -la dist/assets/*.css
          else
            echo "❌ NENHUM CSS encontrado!"
          fi
          echo ""
          echo "📄 Verificando JS:"
          if ls dist/assets/*.js 2>/dev/null; then
            echo "✅ JS encontrado!"
            ls -la dist/assets/*.js
          else
            echo "❌ NENHUM JS encontrado!"
          fi
          echo ""
          echo "📄 Primeiras 30 linhas do index.html:"
          head -30 dist/index.html
      
      - name: Force new deployment
        run: echo "Deployed at $(date +%s)" > dist/version.txt
      
      # Tenta o deploy uma vez
      - name: Deploy to Firebase Hosting (attempt 1)
        uses: FirebaseExtended/action-hosting-deploy@v0.10.0
        id: deploy1
        continue-on-error: true
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PORTFOLIO }}'
          projectId: app-vuets
          channelId: live
      
      # Se falhar, tenta novamente com uma nova versão
      - name: Retry deployment with new version
        if: steps.deploy1.outcome == 'failure'
        run: |
          echo "Retry at $(date +%s)" >> dist/version.txt
          echo "Retry deployment..."
      
      - name: Deploy to Firebase Hosting (attempt 2)
        if: steps.deploy1.outcome == 'failure'
        uses: FirebaseExtended/action-hosting-deploy@v0.10.0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PORTFOLIO }}'
          projectId: app-vuets
          channelId: live
