name: Deploy to Firebase

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build
      
      - name: Force new deployment
        run: echo "Deployed at $(date +%s)" > dist/version.txt
      
      # Tenta o deploy uma vez
      - name: Deploy to Firebase Hosting (attempt 1)
        uses: FirebaseExtended/action-hosting-deploy@v0.10.0
        id: deploy1
        continue-on-error: true
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: app-vuets
          channelId: live
      
      # Se falhar, tenta novamente com uma nova versão
      - name: Retry deployment with new version
        if: steps.deploy1.outcome == 'failure'
        run: |
          echo "Retry at $(date +%s)" >> dist/version.txt
          echo "Retry deployment..."
      
      - name: Deploy to Firebase Hosting (attempt 2)
        if: steps.deploy1.outcome == 'failure'
        uses: FirebaseExtended/action-hosting-deploy@v0.10.0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: app-vuets
          channelId: live
